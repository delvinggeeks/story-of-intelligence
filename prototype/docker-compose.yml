services:
  academy:
    build:
      context: .
      dockerfile: Dockerfile
    image: story-of-intelligence-academy:local
    init: true
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8765
      PORT_ATTEMPTS: 1
      MAX_REQUEST_BYTES: 16384
    volumes:
      - academy-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  academy-data:
