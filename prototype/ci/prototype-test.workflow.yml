name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run layered test suite
        run: npm run test:ci

      - name: Build production container
        run: docker build -t story-of-intelligence-academy:ci .

      - name: Smoke test production container
        run: |
          docker run -d --name academy-ci -p 8765:8765 story-of-intelligence-academy:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs academy-ci
          exit 1

      - name: Stop production container
        if: always()
        run: docker rm --force academy-ci 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
