name: Verify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Every `uses:` below is pinned to an immutable commit SHA rather than a tag, because a
# tag can be moved to point at new code. The trailing comment records which release the
# SHA is, since the SHA alone is unreadable; bumping one means changing both.

jobs:
  api:
    name: API (uv / FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Hardlinking is unreliable on synced/overlay filesystems; copying is portable.
      UV_LINK_MODE: copy
      # Runner-local throwaway service containers. No hosted database, no real credentials.
      ACADEMY_DATABASE_URL: postgresql+asyncpg://academy:academy_local_dev@127.0.0.1:5432/academy
      # Exercise the disabled-cache path here; the e2e job runs the cache-enabled one.
      ACADEMY_REDIS_URL: ""
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy_local_dev
          POSTGRES_DB: academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy -d academy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # Without a per-job suffix this job and `e2e` compute the same cache key, run
          # concurrently, and one of them fails to save it.
          cache-suffix: api

      - name: Verify lockfile is current
        run: uv lock --directory services/api --check

      - name: Install dependencies
        run: uv sync --directory services/api --all-groups --locked

      - name: Lint
        run: uv run --directory services/api ruff check .

      - name: Format check
        run: uv run --directory services/api ruff format --check .

      - name: Type check
        run: uv run --directory services/api mypy

      - name: Apply migrations
        run: uv run --directory services/api alembic upgrade head

      - name: Check migrations match the models
        run: uv run --directory services/api alembic check

      - name: Verify migrations are reversible
        run: |
          uv run --directory services/api alembic downgrade base
          uv run --directory services/api alembic upgrade head

      - name: Test
        run: uv run --directory services/api pytest

  web:
    name: Web (Next.js / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      # `npm ci` refuses to run when package.json and package-lock.json disagree, so this
      # doubles as the lockfile-integrity check.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:web

      - name: Test
        run: npm run test:web

      # Typed routes are emitted by the build, so it must run before the standalone type check.
      - name: Build
        run: npm run build:web

      - name: Type check
        run: npm run typecheck:web

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_LINK_MODE: copy
      NEXT_TELEMETRY_DISABLED: "1"
      ACADEMY_DATABASE_URL: postgresql+asyncpg://academy:academy_local_dev@127.0.0.1:5432/academy
      # The full production shape, cache included, unlike the api job's degraded path.
      ACADEMY_REDIS_URL: redis://127.0.0.1:6379/0
      NEXT_PUBLIC_ACADEMY_API_URL: http://127.0.0.1:8000
      ACADEMY_API_URL: http://127.0.0.1:8000
      # Playwright starts and stops the API and the production web server itself.
      ACADEMY_E2E_MANAGE_SERVERS: "1"
    # The runner creates and destroys these around the job, so every backing service this
    # job depends on is its own and outlives nothing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy_local_dev
          POSTGRES_DB: academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy -d academy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: e2e

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install API dependencies
        run: uv sync --directory services/api --all-groups --locked

      - name: Install web dependencies
        run: npm ci

      - name: Apply migrations
        run: uv run --directory services/api alembic upgrade head

      # The suite runs against the production build, not the dev server.
      - name: Build
        run: npm run build:web

      - name: Install Chromium
        run: npx --workspace @academy/web playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e

      # Traces, screenshots, and videos are only written for failed tests; the server
      # logs are always written but are only worth keeping when there is a failure.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/test-results
            apps/web/e2e-logs
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reported, never a silent delivery block: an upstream advisory with no released fix
    # must not stop unrelated changes from shipping. Failures here require a triage note
    # in docs/governance/evidence-register.md before merge.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Mirrored into the job summary so an advisory is visible without opening the log.
      - name: Audit
        run: |
          set +e
          npm audit --audit-level=high | tee audit.txt
          status=${PIPESTATUS[0]}
          {
            echo '## npm audit (advisory)'
            echo ''
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
