name: Verify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API (uv / FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Hardlinking is unreliable on synced/overlay filesystems; copying is portable.
      UV_LINK_MODE: copy
      # Runner-local throwaway service containers. No hosted database, no real credentials.
      ACADEMY_DATABASE_URL: postgresql+asyncpg://academy:academy_local_dev@127.0.0.1:5432/academy
      # Exercise the disabled-cache path in CI; degradation must never fail the suite.
      ACADEMY_REDIS_URL: ""
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy_local_dev
          POSTGRES_DB: academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy -d academy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --directory services/api --check

      - name: Install dependencies
        run: uv sync --directory services/api --all-groups --locked

      - name: Lint
        run: uv run --directory services/api ruff check .

      - name: Format check
        run: uv run --directory services/api ruff format --check .

      - name: Type check
        run: uv run --directory services/api mypy

      - name: Apply migrations
        run: uv run --directory services/api alembic upgrade head

      - name: Check migrations match the models
        run: uv run --directory services/api alembic check

      - name: Verify migrations are reversible
        run: |
          uv run --directory services/api alembic downgrade base
          uv run --directory services/api alembic upgrade head

      - name: Test
        run: uv run --directory services/api pytest

  web:
    name: Web (Next.js / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:web

      - name: Test
        run: npm run test:web

      # Typed routes are emitted by the build, so it must run before the standalone type check.
      - name: Build
        run: npm run build:web

      - name: Type check
        run: npm run typecheck:web

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_LINK_MODE: copy
      NEXT_TELEMETRY_DISABLED: "1"
      ACADEMY_DATABASE_URL: postgresql+asyncpg://academy:academy_local_dev@127.0.0.1:5432/academy
      ACADEMY_REDIS_URL: ""
      # Playwright starts and stops the API and the production web server itself.
      ACADEMY_E2E_MANAGE_SERVERS: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy_local_dev
          POSTGRES_DB: academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy -d academy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install API dependencies
        run: uv sync --directory services/api --all-groups --locked

      - name: Install web dependencies
        run: npm ci

      - name: Apply migrations
        run: uv run --directory services/api alembic upgrade head

      # The suite runs against the production build, not the dev server.
      - name: Build
        run: npm run build:web

      - name: Install Chromium
        run: npx --workspace @academy/web playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reported, never a silent delivery block: an upstream advisory with no released fix
    # must not stop unrelated changes from shipping. Failures here require a triage note
    # in docs/governance/evidence-register.md before merge.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
